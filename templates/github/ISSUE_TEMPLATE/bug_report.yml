name: Bug Report
description: Report a reproducible defect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior vs. expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run '...'
        2. Pass input '...'
        3. Observe error '...'
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (OS, runtime version, commit/tag)
    validations:
      required: true
