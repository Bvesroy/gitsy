name: Tests

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: {{MATRIX_OS}}
        runtime: {{MATRIX_RUNTIME}}
    steps:
      - uses: actions/checkout@v4

      - name: Set up runtime
        uses: {{SETUP_ACTION}}
        with:
{{SETUP_ARGS}}

      - name: Install dependencies
        run: {{INSTALL_CMD}}

      - name: Build
        run: {{BUILD_CMD}}

      - name: Test
        run: {{TEST_CMD}}

{{LINT_STEP}}
